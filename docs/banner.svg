<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16202e"/>
      <stop offset="55%" stop-color="#1b2735"/>
      <stop offset="100%" stop-color="#232f3e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ffc266"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g fill="#ffffff" opacity="0.04">
    <circle cx="60" cy="60" r="2"/><circle cx="120" cy="60" r="2"/><circle cx="180" cy="60" r="2"/>
    <circle cx="60" cy="120" r="2"/><circle cx="120" cy="120" r="2"/><circle cx="180" cy="120" r="2"/>
    <circle cx="1140" cy="260" r="2"/><circle cx="1080" cy="260" r="2"/><circle cx="1020" cy="260" r="2"/>
  </g>

  <!-- accent bar -->
  <rect x="0" y="0" width="10" height="320" rx="5" fill="url(#orange)"/>

  <!-- title -->
  <text x="70" y="120" font-size="62" font-weight="800" fill="#ffffff">Mini-Jira <tspan fill="#ff9900">on AWS</tspan></text>
  <text x="72" y="162" font-size="24" font-weight="500" fill="#9fb3c8">Multi-team task management · Event-driven · Highly available</text>

  <!-- tech chips -->
  <g font-size="16" font-weight="600">
    <g filter="url(#shadow)">
      <rect x="72" y="195" width="120" height="38" rx="19" fill="#2d3b4d"/>
      <text x="132" y="220" fill="#cfe0f0" text-anchor="middle">React</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="204" y="195" width="140" height="38" rx="19" fill="#2d3b4d"/>
      <text x="274" y="220" fill="#cfe0f0" text-anchor="middle">Node.js</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="356" y="195" width="150" height="38" rx="19" fill="#2d3b4d"/>
      <text x="431" y="220" fill="#cfe0f0" text-anchor="middle">DynamoDB</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="518" y="195" width="130" height="38" rx="19" fill="#2d3b4d"/>
      <text x="583" y="220" fill="#cfe0f0" text-anchor="middle">Cognito</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="660" y="195" width="160" height="38" rx="19" fill="#2d3b4d"/>
      <text x="740" y="220" fill="#cfe0f0" text-anchor="middle">Lambda · SNS</text>
    </g>
  </g>

  <!-- kanban motif -->
  <g filter="url(#shadow)">
    <!-- To Do -->
    <rect x="900" y="60" width="62" height="200" rx="10" fill="#243244"/>
    <rect x="912" y="74" width="38" height="6" rx="3" fill="#5a6b80"/>
    <rect x="910" y="92" width="42" height="26" rx="5" fill="#34465c"/>
    <rect x="910" y="124" width="42" height="26" rx="5" fill="#34465c"/>
    <!-- In Progress -->
    <rect x="972" y="60" width="62" height="200" rx="10" fill="#243244"/>
    <rect x="984" y="74" width="38" height="6" rx="3" fill="#ff9900"/>
    <rect x="982" y="92" width="42" height="26" rx="5" fill="#3a4d33"/>
    <!-- In Review -->
    <rect x="1044" y="60" width="62" height="200" rx="10" fill="#243244"/>
    <rect x="1056" y="74" width="38" height="6" rx="3" fill="#6f9bd1"/>
    <rect x="1054" y="92" width="42" height="26" rx="5" fill="#34465c"/>
    <rect x="1054" y="124" width="42" height="26" rx="5" fill="#34465c"/>
    <!-- Done -->
    <rect x="1116" y="60" width="62" height="200" rx="10" fill="#243244"/>
    <rect x="1128" y="74" width="38" height="6" rx="3" fill="#4caf7d"/>
    <rect x="1126" y="92" width="42" height="26" rx="5" fill="#2f4a3d"/>
    <rect x="1126" y="124" width="42" height="26" rx="5" fill="#2f4a3d"/>
  </g>
</svg>
